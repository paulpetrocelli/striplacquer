<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝑺𝑻𝑹𝑰𝑷 𝑳𝑨𝑪𝑸𝑼𝑬𝑹</title>
<link rel="icon" type="image/x-icon" href="img/favicon9.png">

<style>
/* ------------------ FONT SETUP ------------------ */
@font-face {
  font-family: "Traditional Arabic";
  src: url("fonts/TraditionalArabic.woff2") format("woff2"),
       url("fonts/TraditionalArabic.woff") format("woff"),
       url("fonts/TraditionalArabic.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}

@font-face {
  font-family: "Edition";
  src: url("fonts/editionregular.woff2") format("woff2"),
       url("fonts/editionregular.woff") format("woff");
  font-display: swap;
}

/* ------------------ GLOBAL RESET ------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ------------------ BODY / BACKGROUND ------------------ */
body {
  font-family: "Traditional Arabic", serif;
  line-height: 1.5;
  color: #dbdbdb;
  background-color: #000;
  background-image: url("img/Texturelabs_LensFX_232XL.jpg");
  background-size: 80% auto;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-blend-mode: screen;
  filter: contrast(110%) brightness(100%);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ------------------ TAPE IMAGE LAYER ------------------ */
.tape-background {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(50vw, 550px);
  max-width: 90vw;
  z-index: 1;
  pointer-events: none;
}

.tape-background img {
  width: 100%;
  height: auto;
  max-height: 80vh;
  display: block;
}

/* ------------------ LEFT COLUMN / NAV ------------------ */
.left-column {
  position: fixed;
  top: 25px;
  left: 2vw;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  z-index: 100;
  width: max-content;
}

.logo-link {
  display: inline-block;
  height: 150px;
}

.site-logo {
  height: 100%;
  display: block;
}

nav {
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  margin-top: 80px;
  width: max-content;
}

nav a {
  display: inline-block;
  text-decoration: none;
  color: #dbdbdb;
  font-family: "Edition", serif;
  font-size: 3rem;
  letter-spacing: 1.5px;
  white-space: nowrap;
  line-height: 0.9;
}

/* ------------------ MUSIC BUTTONS ------------------ */
.music-container {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.music-links {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.music-links a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 230px;
  height: 52px;
  font-family: "Edition", serif;
  font-size: 1.2rem;
  letter-spacing: 1px;
  text-decoration: none;
  color: #dbdbdb;
  border: 1px solid #dbdbdb;
  background: transparent;
  cursor: pointer;
  transition: background-color .3s ease, color .3s ease;
}

.music-links a:hover {
  background: #dbdbdb;
  color: #000;
}

.music-links a img {
  width: 18px;
  height: 18px;
  object-fit: contain;
  filter: invert(1);
  transition: filter .3s ease;
}

.music-links a:hover img {
  filter: invert(0);
}

/* ------------------ MOBILE ------------------ */
@media (max-width:768px) {

  nav a {
    font-size: 2rem;
  }

  .music-links a {
    width: 200px;
  }

  .tape-background {
    width: 80%;
  }
}
</style>
</head>

<body>

<div class="tape-background">
  <img src="img/temporary tapes.jpg" alt="Music Artwork">
</div>

<div class="left-column">
  <a href="/index.html" class="logo-link">
    <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer">
  </a>

  <nav>
    <a href="/bio.html">BIO</a>
    <a href="/music.html">MUSIC</a>
    <a href="https://www.instagram.com/striplacquer" target="_blank">INSTAGRAM</a>
    <a href="/newsletter.html">NEWSLETTER</a>
    <a href="/contact.html">CONTACT</a>
  </nav>
</div>

<div class="music-container">
  <div class="music-links">
    <a href="https://striplacquer.bandcamp.com/" target="_blank">
      <img src="img/bandcamp.svg" alt="">
      BANDCAMP
    </a>

    <a href="https://www.youtube.com/@striplacquer" target="_blank">
      <img src="img/youtube.svg" alt="">
      YOUTUBE
    </a>

    <a href="https://soundcloud.com/strip-lacquer" target="_blank">
      <img src="img/soundcloud.svg" alt="">
      SOUNDCLOUD
    </a>
  </div>
</div>

</body>
</html>
