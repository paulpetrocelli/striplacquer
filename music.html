<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>𝑺𝒕𝒓𝒊𝒑 𝑳𝒂𝒄𝒒𝒖𝒆𝒓</title>
  <link rel="icon" type="image/x-icon" href="img/favicon9.png" />

  <style>
    /* ------------------ Font Setup ------------------ */
    @font-face {
      font-family: "Traditional Arabic Regular";
      src: local("Traditional Arabic Regular"),
           url("fonts/TraditionalArabic.woff2") format("woff2"),
           url("fonts/TraditionalArabic.woff") format("woff"),
           url("fonts/TraditionalArabic.ttf") format("truetype");
    }

    @font-face {
      font-family: "Trickster Outline";
      src: url("trickster-COLRv1.otf") format("opentype") tech(color-COLRv1),
           url("trickster-outline.otf") format("opentype"),
           url("trickster-outline.woff") format("woff");
    }

    /* ------------------ Base Reset ------------------ */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      background-color: #000;
      color: #f78f8f;
      font-family: "Traditional Arabic Regular", serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1 {
      font-family: "Georgia";
      color: #f78f8f;
    }

    /* ------------------ Header & Navigation ------------------ */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      padding: 0 30px;
      z-index: 1000;
      background-color: transparent;
    }

    .logo-link {
      display: inline-block;
      height: 120px;
      margin-right: 50px;
    }

    .site-logo {
      height: 100%;
      display: block;
    }

    nav {
      display: flex;
      gap: 2rem;
      font-size: 1rem;
    }

    nav a {
      text-decoration: none;
      color: #f78f8f;
      font-weight: bold;
      letter-spacing: 1px;
      position: relative;
      font-family: inherit;
    }

    nav a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      left: 0;
      bottom: -4px;
      background-color: #f78f8f;
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* ------------------ Banner Spacing ------------------ */
    .banner {
      position: relative;
      background: #000;
      padding-top: 120px; /* match .top-bar height */
    }

    /* ------------------ Music Section ------------------ */
    .music-links {
      padding: 0.5rem 2rem 1.5rem; /* tightened spacing */
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      min-height: calc(100vh - 120px);
    }

    .music-container {
      display: flex;
      flex-direction: row;
      gap: 5rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1200px;
      width: 100%;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 300px;
    }

    .button-group h2 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    .link-button {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background-color: transparent;
      border: 2px solid #f78f8f;
      color: #f78f8f;
      font-size: 1rem;
      padding: 0.5rem 1.2rem;
      text-decoration: none;
      font-family: inherit;
      border-radius: 0;
      transition: all 0.3s ease;
      justify-content: center;
    }

    .link-button:hover {
      background-color: #f78f8f;
      color: #000;
    }

    .link-button:hover .icon {
      filter: invert(0);
    }

    .icon {
      width: 20px;
      height: 20px;
      filter: brightness(0) saturate(100%) invert(78%) sepia(19%) saturate(746%) hue-rotate(304deg) brightness(93%) contrast(89%);
      transition: filter 0.3s ease;
    }

    /* ------------------ Tape Image ------------------ */
    .image-box img {
      width: 320px;
      max-width: 100%;
      height: auto;
      border-radius: 0;
      box-shadow: none;
    }

  </style>
</head>

<body>
  <div class="top-bar">
    <a href="/index.html" class="logo-link">
      <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo" />
    </a>
    <nav>
      <a href="/bio.html">◊ BIO</a>
      <a href="/music.html">◊ MUSIC</a>
      <a href="/gallery.html">◊ GALLERY</a>
      <a href="/newsletter.html">◊ NEWSLETTER</a>
    </nav>
  </div>

  <main class="music-links">
    <div class="music-container">
      <div class="button-group">
        <h2>Listen to Strip Lacquer</h2>

        <a href="https://striplacquer.bandcamp.com/" class="link-button" target="_blank">
          <img src="img/bandcamp.svg" class="icon" alt="Bandcamp logo" /> Bandcamp
        </a>

        <a href="https://www.youtube.com/@striplacquer" class="link-button" target="_blank">
          <img src="img/youtube.svg" class="icon" alt="YouTube logo" /> YouTube
        </a>

        <a href="https://soundcloud.com/strip-lacquer" class="link-button" target="_blank">
          <img src="img/soundcloud.svg" class="icon" alt="SoundCloud logo" /> SoundCloud
        </a>
      </div>

      <div class="image-box">
        <img src="img/temporary tapes.jpg" alt="Tape photo" />
      </div>
    </div>
  </main>
</body>

</html>
