<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝑺𝑻𝑹𝑰𝑷 𝑳𝑨𝑪𝑸𝑼𝑹 — MUSIC</title>
<link rel="icon" type="image/x-icon" href="img/favicon9.png">

<style>
/* ------------------ RESET ------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ------------------ BODY / BACKGROUND ------------------ */
body {
  font-family: "Traditional Arabic", serif;
  color: #dbdbdb;
  background-color: #000;
  background-image: url("img/Texturelabs_LensFX_232XL.jpg");
  background-size: 80% auto;         /* gold standard size */
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-blend-mode: screen;
  filter: contrast(110%) brightness(100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  position: relative;
}

/* ------------------ LEFT NAV ------------------ */
.left-column {
  position: fixed;
  top: 25px;
  left: 2vw;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  z-index: 1000;
  width: fit-content; /* only as wide as content */
}

.logo-link {
  display: inline-block;
  height: 150px;
}

.site-logo {
  height: 100%;
  display: block;
}

nav {
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  margin-top: 80px;
  width: fit-content;
}

nav a {
  display: inline-block; /* only the text is clickable */
  text-decoration: none;
  color: #dbdbdb;
  font-family: "Edition", serif;
  font-size: 3rem;
  letter-spacing: 1.5px;
  line-height: 0.9;
  white-space: nowrap;
}

/* ------------------ MUSIC CONTAINER ------------------ */
.music-container {
  display: flex;
  align-items: center;
  gap: 3rem;
  z-index: 500;
}

/* ------------------ MUSIC BUTTONS ------------------ */
.music-links {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.music-links a {
  width: 230px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #dbdbdb;
  border: 1px solid #dbdbdb;
  font-family: "Edition", serif;
  font-size: 1.2rem;
  letter-spacing: 1px;
  text-decoration: none;
  position: relative;
  overflow: hidden;
  transition: color 0.3s ease, border-color 0.3s ease;
}

/* Hover overlay effect */
.music-links a::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background-color: #dbdbdb;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
  z-index: 0;
}

.music-links a * {
  position: relative;
  z-index: 1;
  transition: color 0.3s ease, filter 0.3s ease;
}

.music-links a:hover::before {
  transform: scaleX(1);
}

.music-links a:hover {
  color: #000;
  border-color: #dbdbdb;
}

.music-links a:hover img {
  filter: invert(1);
}

.music-links img {
  height: 18px;
  width: 18px;
  object-fit: contain;
  transition: filter 0.3s ease;
}

/* ------------------ MUSIC IMAGE ------------------ */
.music-image {
  width: min(50vw, 550px);
  max-width: 90vw;
}

.music-image img {
  width: 100%;
  height: auto;
  max-height: 80vh;
  display: block;
}

/* ------------------ RESPONSIVE ------------------ */
@media (max-width: 768px) {
  .music-container {
    flex-direction: column;
    gap: 2rem;
  }

  .music-links a {
    width: 200px;
  }

  nav a {
    font-size: 2rem;
  }

  .music-image {
    width: 80%;
  }
}
</style>
</head>

<body>

<div class="left-column">
  <a href="/index.html" class="logo-link">
    <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo">
  </a>

  <nav>
    <a href="/bio.html">BIO</a>
    <a href="/music.html">MUSIC</a>
    <a href="https://www.instagram.com/striplacquer" target="_blank">INSTAGRAM</a>
    <a href="/newsletter.html">NEWSLETTER</a>
    <a href="/contact.html">CONTACT</a>
  </nav>
</div>

<div class="music-container">
  <div class="music-links">
    <a href="https://striplacquer.bandcamp.com/" target="_blank">
      <img src="img/bandcamp.svg" alt="">BANDCAMP
    </a>
    <a href="https://www.youtube.com/@striplacquer" target="_blank">
      <img src="img/youtube.svg" alt="">YOUTUBE
    </a>
    <a href="https://soundcloud.com/strip-lacquer" target="_blank">
      <img src="img/soundcloud.svg" alt="">SOUNDCLOUD
    </a>
  </div>

  <div class="music-image">
    <img src="img/temporary tapes.jpg" alt="Music Artwork">
  </div>
</div>

</body>
</html>
