<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>𝑺𝒕𝒓𝒊𝒑 𝑳𝒂𝒄𝒒𝒖𝒆𝒓</title>
  <link rel="icon" type="img/x-icon" href="img/favicon9.png" />
  <style>
    @font-face {
      font-family: "Traditional Arabic";
      src: url("fonts/TraditionalArabic.woff2") format("woff2"),
           url("fonts/TraditionalArabic.woff") format("woff"),
           url("fonts/TraditionalArabic.ttf") format("truetype");
    }

    body {
      margin: 0;
      font-family: "Traditional Arabic", serif;
      color: #f78f8f;
      background-color: #000;
    }

    .banner {
      position: relative;
      height: 100vh;
      background: url('fabric-bg.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .top-bar {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0 30px;
      z-index: 1000;
    }

    .logo-link {
      display: inline-block;
      height: 120px;
      margin-right: 50px;
    }

    .site-logo {
      height: 100%;
      display: block;
    }

    nav {
      display: flex;
      gap: 2rem;
      font-size: 1rem;
    }

    nav a {
      text-decoration: none;
      color: #f78f8f;
      font-weight: bold;
      letter-spacing: 1px;
      position: relative;
      font-family: inherit;
    }

    nav a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      left: 0;
      bottom: -4px;
      background-color: #f78f8f;
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* Buttons section */
    .music-links {
      margin-top: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 4rem 2rem;
      text-align: center;
    }

    .music-links h2 {
      font-size: 1.8rem;
      margin-bottom: 2rem;
      color: #f78f8f;
      letter-spacing: 1px;
    }

    .link-button {
      background-color: transparent;
      border: 2px solid #f78f8f;
      color: #f78f8f;
      font-size: 1.2rem;
      padding: 0.75rem 2rem;
      text-decoration: none;
      font-family: inherit;
      border-radius: 5px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .link-button:hover {
      background-color: #f78f8f;
      color: #000;
    }
  </style>
</head>
<body>

  <header class="banner">
    <div class="top-bar">
      <a href="/index.html" class="logo-link">
        <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo" />
      </a>
      <nav>
        <a href="/bio.html">◊ BIO </a>
        <a href="/music.html">◊ MUSIC </a>
        <a href="/gallery.html">◊ GALLERY </a>
        <a href="/newsletter.html">◊ NEWSLETTER </a>
      </nav>
    </div>
  </header>

<!-- Music Platform Links - Horizontal Layout -->
<section class="music-links">
    <div class="music-container">
      <div class="button-group">
        <h2>Listen to Strip Lacquer</h2>
        <a href="https://striplacquer.bandcamp.com/" target="_blank" class="link-button">Bandcamp</a>
        <a href="https://www.youtube.com/@striplacquer" target="_blank" class="link-button">YouTube</a>
        <a href="https://soundcloud.com/strip-lacquer" target="_blank" class="link-button">SoundCloud</a>
      </div>
      <div class="image-box">
        <img src="img/temporary tapes.jpg" alt="Strip Lacquer Demo Tape" />
      </div>
    </div>
  </section>
  

</body>
</html>
