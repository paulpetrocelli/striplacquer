<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>𝑺𝒕𝒓𝒊𝒑 𝑳𝒂𝒄𝒒𝒖𝒆𝒓</title>
    <link rel="icon" type="image/x-icon" href="img/favicon9.png" />

    <style>
      @font-face {
        font-family: "Traditional Arabic";
        src: url("fonts/TraditionalArabic.woff2") format("woff2"),
          url("fonts/TraditionalArabic.woff") format("woff"),
          url("fonts/TraditionalArabic.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
      }

      body {
        margin: 0;
        background-color: #000;
        color: #f88288;
        font-family: "Traditional Arabic", serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      h1,
      h2,
      nav a,
      .link-button {
        font-family: "Traditional Arabic", serif;
      }

      .top-bar {
        position: fixed;
        top: 60px;
        left: 0;
        width: 100%;
        display: flex;
        align-items: center;
        padding: 0 2vw;
        z-index: 1000;
        gap: 2vw;
        box-sizing: border-box;
      }

      .logo-link {
        display: inline-block;
        height: 120px;
        flex-shrink: 0;
      }

      .site-logo {
        height: 100%;
        display: block;
      }

      nav {
        display: flex;
        gap: 2vw;
        font-size: 1rem;
        flex-wrap: wrap;
      }

      nav a {
        text-decoration: none;
        color: #f88288;
        font-weight: bold;
        letter-spacing: 1px;
        position: relative;
      }

      nav a::after {
        content: "";
        position: absolute;
        width: 0;
        height: 2px;
        left: 0;
        bottom: -4px;
        background-color: #f88288;
        transition: width 0.3s ease;
      }

      nav a:hover::after {
        width: 100%;
      }

      .banner-offset {
        height: 144px;
      }

      .music-links {
        padding: 0.5rem 2rem 1.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000;
        min-height: calc(100vh - 180px);
      }

      .music-container {
        display: flex;
        flex-direction: row;
        gap: 5rem;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
        max-width: 1200px;
        width: 100%;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        max-width: 300px;
      }

      .button-group h2 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
        color: #f88288;
      }

      .link-button {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background-color: transparent;
        border: 2px solid #f88288;
        color: #f88288;
        font-size: 1.1rem;
        padding: 0.6rem 1.3rem;
        text-decoration: none;
        font-family: "Traditional Arabic", serif;
        border-radius: 0;
        transition: all 0.3s ease;
        justify-content: center;
      }

      .link-button:hover {
        background-color: #f88288;
        color: #000;
      }

      .link-button:hover .icon {
        filter: invert(0);
      }

      .icon {
        width: 22px;
        height: 22px;
        filter: brightness(0) saturate(100%) invert(78%) sepia(19%)
          saturate(746%) hue-rotate(304deg) brightness(93%) contrast(89%);
        transition: filter 0.3s ease;
      }

      .image-box img {
        width: 352px;
        max-width: 100%;
        height: auto;
        border-radius: 0;
        box-shadow: none;
      }

      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          padding: 0 2vw;
          top: 2vh;
        }
        .logo-link {
          width: 100;
        }
        .site-logo {
          width: 100%;
          object-fit: contain;
        }
        nav {
          justify-content: center;
        }
        .banner-offset {
          height: 35vh;
        }
        .music-container {
          flex-direction: column-reverse;
        }
      }
    </style>
  </head>

  <body>
    <!-- Top bar -->
    <div class="top-bar">
      <a href="/index.html" class="logo-link">
        <img
          src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png"
          class="site-logo"
          alt="Strip Lacquer Logo"
        />
      </a>
      <nav>
        <a href="/bio.html"><span style="white-space: nowrap">◊ BIO</span></a>
        <a href="/music.html"
          ><span style="white-space: nowrap">◊ MUSIC</span></a
        >
        <a href="https://www.instagram.com/striplacquer" target="_blank" rel="noopener noreferrer">
          <span style="white-space: nowrap">◊ INSTAGRAM</span>
        </a>        
        <a href="/newsletter.html"
          ><span style="white-space: nowrap">◊ NEWSLETTER</span></a
        >
        <a href="/contact.html"
          ><span style="white-space: nowrap">◊ CONTACT</span></a
        >
      </nav>
    </div>

    <div class="banner-offset"></div>

    <!-- Main music content -->
    <main class="music-links">
      <div class="music-container">
        <div class="button-group">
          <h2><em>Listen to Strip Lacquer ~</em></h2>

          <a
            href="https://striplacquer.bandcamp.com/"
            class="link-button"
            target="_blank"
          >
            <img src="img/bandcamp.svg" class="icon" alt="Bandcamp logo" />
            Bandcamp
          </a>

          <a
            href="https://www.youtube.com/@striplacquer"
            class="link-button"
            target="_blank"
          >
            <img src="img/youtube.svg" class="icon" alt="YouTube logo" />
            YouTube
          </a>

          <a
            href="https://soundcloud.com/strip-lacquer"
            class="link-button"
            target="_blank"
          >
            <img src="img/soundcloud.svg" class="icon" alt="SoundCloud logo" />
            SoundCloud
          </a>
        </div>

        <div class="image-box">
          <img src="img/temporary tapes.jpg" alt="Tape photo" />
        </div>
      </div>
    </main>
  </body>
</html>
