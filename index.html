<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>𝑺𝒕𝒓𝒊𝒑 𝑳𝒂𝒄𝒒𝒖𝒆𝒓</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* --------------- Font --------------- */
    @font-face {
      font-family: "Traditional Arabic Regular";
      src: local("Traditional Arabic Regular"),
           url("fonts/TraditionalArabic.woff2") format("woff2"),
           url("fonts/TraditionalArabic.woff") format("woff"),
           url("fonts/TraditionalArabic.ttf") format("truetype");
    }

    @font-face {
      font-family: "Trickster Outline";
      src: url("trickster-COLRv1.otf") format("opentype") tech(color-COLRv1),
           url("trickster-outline.otf") format("opentype"),
           url("trickster-outline.woff") format("woff");
    }

    body {
      margin: 0;
      background-color: #000;
      color: #f78f8f;
      font-family: "Traditional Arabic Regular", serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
      text-transform: none;
    }

    /* --------------- Top Bar --------------- */
    .top-bar {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      padding: 0 30px;
      z-index: 1000;
      background-color: transparent;
    }

    .logo-link {
      display: inline-block;
      height: 120px;
      margin-right: 50px;
    }

    .site-logo {
      height: 100%;
      display: block;
    }

    nav {
      display: flex;
      gap: 2rem;
      font-size: 1rem;
    }

    nav a {
      text-decoration: none;
      color: #f78f8f;
      font-weight: bold;
      letter-spacing: 1px;
      position: relative;
      font-family: inherit;
    }

    nav a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      left: 0;
      bottom: -4px;
      background-color: #f78f8f;
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* --------------- Banner --------------- */
    .banner {
      position: relative;
      min-height: 100vh;
      padding-top: 180px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      background: #000;
      text-align: center;
    }

    .banner-content img {
      display: block;
      width: 60%;
      max-width: 800px;
      height: auto;
      margin: 0 auto 1rem;
    }

    .banner-content h1 {
      font-size: 2rem;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f78f8f;
    }

    /* --------------- Responsive --------------- */
    @media (max-width: 768px) {
      .top-bar {
        top: 0;
        height: auto;
        flex-direction: column;
        align-items: center;
        padding: 1rem;
        gap: 0.5rem;
        background-color: #000;
      }

      .logo-link {
        height: 80px;
        margin-right: 0;
      }

      nav {
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .banner {
        padding-top: 160px;
      }

      .banner-content img {
        width: 100%;
        margin-top: 0;
        max-width: none;
      }

      .banner-content h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <a href="index.html" class="logo-link">
      <img src="images/logo.svg" alt="Strip Lacquer Logo" class="site-logo" />
    </a>
    <nav>
      <a href="bio.html">◊ BIO</a>
      <a href="music.html">◊ MUSIC</a>
      <a href="newsletter.html">◊ MAILING LIST</a>
    </nav>
  </header>

  <main class="banner">
    <div class="banner-content">
      <img src="images/banner-image.jpg" alt="Banner" />
      <h1>CATEGORIES</h1>
    </div>
  </main>

</body>
</html>
