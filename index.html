<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝑺𝑻𝑹𝑰𝑷 𝑳𝑨𝑪𝑸𝑼𝑹</title>
<link rel="icon" type="image/x-icon" href="img/favicon9.png">
<link rel="stylesheet" href="styles.css">
<style>
/* ------------------ GLOBAL RESET ------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ------------------ BODY / BACKGROUND ------------------ */
body {
  font-family: "Traditional Arabic", serif;
  line-height: 1.5;
  color: #dbdbdb;
  background-color: #000;
  background-image: url("img/Texturelabs_LensFX_232XL.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-blend-mode: screen;
  filter: contrast(110%) brightness(100%);
}

/* ------------------ LEFT COLUMN / NAV ------------------ */
.left-column {
  position: fixed;
  top: 25px;
  left: 2vw;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  z-index: 1000;
}

.logo-link {
  display: block;
  height: 150px;
}

.site-logo {
  height: 100%;
  display: block;
}

nav {
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  margin-top: 80px;
}

nav a {
  display: block;
  text-decoration: none;
  color: #dbdbdb;
  font-family: "Edition", serif;
  font-size: 3rem;
  letter-spacing: 1.5px;
  white-space: nowrap;
  line-height: 0.9;
}

/* ------------------ HOME WRAPPER / CENTERING ------------------ */
.home-wrapper {
  position: absolute;           /* absolute relative to viewport */
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%); /* perfectly center horizontally & vertically */
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* ------------------ IMAGE ------------------ */
.image-container {
  width: min(50vw, 550px);
  max-width: 90vw;
}

.image-container img {
  width: 100%;
  height: auto;            /* preserve aspect ratio */
  max-height: 80vh;
  display: block;
  margin: 0 auto;
}

/* ------------------ EST TEXT ------------------ */
.est {
  font-size: 1.3rem;
  opacity: 0.7;
  letter-spacing: 1px;
  font-family: "Edition", serif;
  white-space: nowrap;
  margin-top: 1rem;
}

/* ------------------ MOBILE ------------------ */
@media (max-width: 768px) {
  .left-column {
    position: absolute;
  }

  nav a {
    font-size: 2rem;
  }

  .image-container {
    width: 80%;
  }
}
</style>
</head>

<body>

  <div class="home-wrapper">
    <div class="image-container">
      <img src="img/SL.Couch.Square.png" alt="Band Photo">
    </div>
    <div class="est">est. 2024 ©</div>
  </div>

<div class="home-wrapper">
  <div class="image-container">
    <img src="img/SL.Couch.Square.png" alt="Band Photo">
  </div>
  <div class="est">est. 2024 ©</div>
</div>

</body>
</html>
