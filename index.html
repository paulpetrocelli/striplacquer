<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝑺𝑻𝑹𝑰𝑷 𝑳𝑨𝑪𝑸𝑼𝑬𝑹</title>
<link rel="icon" type="image/x-icon" href="img/favicon9.png">

<style>
/* --- Traditional Arabic --- */
@font-face {
  font-family: "Traditional Arabic";
  src: url("fonts/TraditionalArabic.woff2") format("woff2"),
       url("fonts/TraditionalArabic.woff") format("woff"),
       url("fonts/TraditionalArabic.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}

/* --- Edition (local hosting) --- */
@font-face {
  font-family: "Edition";
  src: url("fonts/editionregular.woff2") format("woff2"),
       url("fonts/editionregular.woff") format("woff");
  font-weight: normal;
  font-style: normal;
  font-display: swap; /* ensures legibility if font takes time to load */
}

body{
  margin:0;
  color:#dbdbdb;
  font-family:"Traditional Arabic", serif;

  /* Background */
  background-color:#000;
  background-image:url("img/Texturelabs_LensFX_232XL.jpg");
  background-size: contain;       /* ensures full texture visible */
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;

  background-blend-mode:screen;
  opacity:0.80;
  filter: contrast(110%) brightness(100%);
}

/* LEFT COLUMN */

.left-column{
  position:fixed;
  top:25px;
  left:2vw;
  display:flex;
  flex-direction:column;
  z-index:1000;
}

/* LOGO */

.logo-link{
  display:block;
  height:150px;
}

.site-logo{
  height:100%;
  display:block;
}

/* NAV */

nav{
  display:flex;
  flex-direction:column;
  gap:0.8rem;
  margin-top:80px;
}

nav a{
  text-decoration:none;
  color:#dbdbdb;
  letter-spacing:1.5px;
  font-family:"Edition", serif;
  font-size:3rem;
  white-space:nowrap;
}

/* MAIN CONTENT */

.main-content{
  padding-top:120px;
  padding-left:clamp(260px, 24vw, 420px);
  padding-right:4vw;
  box-sizing:border-box;
  max-width:1200px;
  margin-right:auto;
}

/* IMAGE + EST */

.image-row{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  gap:10px;
}

.image-container{
  max-width:635px;
}

.image-container img{
  width:100%;
  height:auto;
  display:block;
}

/* EST */

.est{
  font-size:1.3rem;
  opacity:0.7;
  letter-spacing:1px;
  font-family:"Edition", serif; /* now using local Edition font */
  font-style:normal;
  white-space:nowrap;
  flex-shrink:0;
}

/* MOBILE */

@media (max-width:768px){

  .left-column{
    position:absolute;
  }

  .main-content{
    padding-left:6vw;
    padding-top:240px;
  }

}

</style>
</head>

<body>

<div class="left-column">

<a href="/index.html" class="logo-link">
<img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo">
</a>

<nav>
<a href="/bio.html">BIO</a>
<a href="/music.html">MUSIC</a>
<a href="https://www.instagram.com/striplacquer" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
<a href="/newsletter.html">NEWSLETTER</a>
<a href="/contact.html">CONTACT</a>
</nav>

</div>

<div class="main-content">

<div class="image-row">

<div class="image-container">
<img src="img/SL.Couch.Square.png" alt="Band Photo">
</div>

<div class="est">est. 2024 ©</div>

</div>

</div>

</body>
</html>
