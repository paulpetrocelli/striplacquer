<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>𝑺𝒕𝒓𝒊𝒑 𝑳𝒂𝒄𝒒𝒖𝒆𝒓</title>
  <link rel="icon" type="image/x-icon" href="img/favicon9.png" />
  <style>
    /* Font Setup */
    @font-face {
      font-family: "Traditional Arabic";
      src: url("fonts/TraditionalArabic.woff2") format("woff2"),
           url("fonts/TraditionalArabic.woff") format("woff"),
           url("fonts/TraditionalArabic.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    /* Base Reset */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Traditional Arabic", serif;
      color: #f78f8f;
      background-color: #000;
      line-height: 1.5;
      max-width: 100%;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1 {
      font-family: Georgia, serif;
      color: #f78f8f;
    }

    /* Sticky Top Bar - DESKTOP */
    .top-bar {
      position: fixed;
      top: 60px;  /* adjust as needed */
      left: 0;
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      padding: 0 30px;
      z-index: 1000;
      background-color: #000;
      gap: 2vw;
      box-sizing: border-box;
    }

    .logo-link {
      display: inline-block;
      height: 120px;
      flex-shrink: 0;
      margin-right: 50px;
    }

    .site-logo {
      height: 100%;
      display: block;
    }

    nav {
      display: flex;
      gap: 2rem;
      font-size: 1rem;
      flex-wrap: wrap;
    }

    nav a {
      color: #f78f8f;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 1px;
      position: relative;
      font-family: inherit;
      white-space: nowrap;
    }

    nav a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      left: 0;
      bottom: -4px;
      background-color: #f78f8f;
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* Banner Section */
    .banner {
      position: relative;
      min-height: 100vh;
      padding-top: 180px; /* 60px top + 120px bar */
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      background: url('fabric-bg.jpg') center/cover no-repeat;
      text-align: center;
    }

    .banner-content {
      width: 100%;
      padding: 0;
      margin: 0;
    }

    .banner-content img {
      display: block;
      width: 60%;
      max-width: 800px;
      height: auto;
      margin: 140px auto 0 auto;
      padding: 0;
      border: none;
    }

    .banner-content h1 {
      font-size: 2rem;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 1rem;
    }

    /* ------------------ Responsive for Smaller Screens ------------------ */
    @media (max-width: 768px) {
      .top-bar {
        top: 0;
        height: auto;
        flex-direction: column;
        align-items: center;
        padding: 1rem;
        gap: 0.5rem;
        background-color: #000;
      }

      .logo-link {
        height: 80px;
        margin-right: 0;
      }

      nav {
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .banner {
        padding-top: 160px;
      }

      .banner-content img {
        width: 100%;
        margin: 140px 0 0 0;
        max-width: none;
      }

      .banner-content h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <header class="banner">
    <div class="top-bar">
      <a href="/index.html" class="logo-link">
        <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo" />
      </a>
      <nav>
        <a href="/bio.html">◊ BIO</a>
        <a href="/music.html">◊ MUSIC</a>
        <a href="/gallery.html">◊ GALLERY</a>
        <a href="/newsletter.html">◊ NEWSLETTER</a>
        <a href="/contact.html">◊ CONTACT</a>
      </nav>
    </div>

    <div class="banner-content">
      <img src="img/SL.Couch.Square.png" alt="Band Photo" />
      <h1>est. 2024</h1>
    </div>
  </header>

</body>
</html>
