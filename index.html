<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>𝑺𝒕𝒓𝒊𝒑 𝑳𝒂𝒄𝒒𝒖𝒆𝒓</title>
    <link rel="icon" type="image/x-icon" href="img/favicon9.png" />
    <style>
      @font-face {
        font-family: "Traditional Arabic";
        src: url("fonts/TraditionalArabic.woff2") format("woff2"),
          url("fonts/TraditionalArabic.woff") format("woff"),
          url("fonts/TraditionalArabic.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      body {
        margin: 0;
        font-family: "Traditional Arabic", serif;
        color: #f88288;
        background-color: #000;
      }

      .top-bar {
        position: fixed;
        top: 60px;
        left: 0;
        width: 100%;
        display: flex;
        align-items: center;
        padding: 0 2vw;
        z-index: 1000;
        gap: 2vw;
        box-sizing: border-box;
      }

      .logo-link {
        display: inline-block;
        height: 120px;
        flex-shrink: 0;
      }

      .site-logo {
        height: 100%;
        display: block;
      }

      nav {
        display: flex;
        gap: 2vw;
        font-size: 1rem;
        flex-wrap: wrap;
      }

      nav a {
        text-decoration: none;
        color: #f88288;
        font-weight: bold;
        letter-spacing: 1px;
        position: relative;
        font-family: inherit;
      }

      nav a::after {
        content: "";
        position: absolute;
        width: 0;
        height: 2px;
        left: 0;
        bottom: -4px;
        background-color: #f88288;
        transition: width 0.3s ease;
      }

      nav a:hover::after {
        width: 100%;
      }

      .banner-offset {
        height: 180px;
      }

      /* Full-width hero banner like bio page */
      .banner-content {
        position: relative;
        width: 100vw;
        max-width: 100vw;
        margin-left: calc(-50vw + 50%);
        padding: 0;
        text-align: center;
      }

      .banner-content img {
        width: 100%;
        height: auto;
        display: block;
      }

      .banner-content h1 {
        font-size: 2rem;
        font-weight: normal;
        color: #f88288;
        letter-spacing: 2px;
        font-family: inherit;
        margin-top: 1.5rem;
      }

      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          padding: 0 2vw;
          top: 2vh;
        }

        .logo-link {
          width: 100%;
        }

        .site-logo {
          width: 100%;
          object-fit: contain;
        }

        nav {
          justify-content: center;
        }

        .banner-offset {
          height: 30vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="top-bar">
      <a href="/index.html" class="logo-link">
        <img
          src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png"
          class="site-logo"
          alt="Strip Lacquer Logo"
        />
      </a>
      <nav>
        <a href="/bio.html"><span style="white-space: nowrap">◊ BIO</span></a>
        <a href="/music.html"
          ><span style="white-space: nowrap">◊ MUSIC</span></a
        >
        <a href="https://www.instagram.com/striplacquer" target="_blank" rel="noopener noreferrer">
          <span style="white-space: nowrap">◊ INSTAGRAM</span>
        </a>        
        <a href="/newsletter.html"
          ><span style="white-space: nowrap">◊ NEWSLETTER</span></a
        >
        <a href="/contact.html"
          ><span style="white-space: nowrap">◊ CONTACT</span></a
        >
      </nav>
    </div>

    <div class="banner-offset"></div>

    <section class="banner-content">
      <img src="img/SL.Couch.Square.png" alt="Band Photo" />
      <h1><em>est. 2024</em></h1>
    </section>
  </body>
</html>
