<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>𝑺𝒕𝒓𝒊𝒑 𝑳𝒂𝒄𝒒𝒖𝒆𝒓</title>
    <link rel="icon" type="img/x-icon" href="img/favicon9.png" />
    <style>
      /* Embed Traditional Arabic font (self-hosted) */
      @font-face {
        font-family: "Traditional Arabic";
        src: url("fonts/TraditionalArabic.woff2") format("woff2"),
          url("fonts/TraditionalArabic.woff") format("woff"),
          url("fonts/TraditionalArabic.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      body {
        margin: 0;
        font-family: "Traditional Arabic", serif;
        color: #c9c9c9;
        background-color: #000;
      }

      /* Banner container */
      .banner {
        position: relative;
        height: 100vh;
        background: url("fabric-bg.jpg") center/cover no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      /* Sticky top bar */
      .top-bar {
        position: fixed;
        top: 60px;
        left: 0;
        width: 100%;
        display: flex;
        align-items: center;
        padding: 0 2vw; /* Responsive horizontal padding */
        z-index: 1000;
        gap: 2vw; /* Adds flexible space between logo and nav */
        box-sizing: border-box;
      }

      .logo-link {
        display: inline-block;
        height: 120px;
        flex-shrink: 0;
      }

      .site-logo {
        height: 100%;
        display: block;
      }

      nav {
        display: flex;
        gap: 2vw; /* Spacing between nav items scales with screen */
        font-size: 1rem;
        flex-wrap: wrap;
      }

      nav a {
        text-decoration: none;
        color: #c9c9c9;
        font-weight: bold;
        letter-spacing: 1px;
        position: relative;
        font-family: inherit;
      }

      /* Underline animation */
      nav a::after {
        content: "";
        position: absolute;
        width: 0;
        height: 2px;
        left: 0;
        bottom: -4px;
        background-color: #c9c9c9;
        transition: width 0.3s ease;
      }

      nav a:hover::after {
        width: 100%;
      }

      /* Center band image and text */
      .banner-content img {
        width: 60%;
        max-width: 800px;
        height: auto;
        margin-bottom: 1rem;
        margin-top: 180px;
      }

      .banner-content h1 {
        font-size: 2rem;
        font-weight: normal;
        color: #c9c9c9;
        text-transform: none;
        letter-spacing: 2px;
        font-family: inherit;
      }

      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          padding: 0 2vw;
          top: 2vh;
        }
        .logo-link {
          width: 100;
        }
        .site-logo {
          width: 100%;
          object-fit: contain;
        }
        nav {
          justify-content: center;
        }
        .banner-offset {
          height: 35vh;
        }
      }
    </style>
  </head>
  <body>
    <header class="banner">
      <div class="top-bar">
        <!-- Clickable logo links to homepage -->
        <a href="/index.html" class="logo-link">
          <img
            src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png"
            class="site-logo"
            alt="Strip Lacquer Logo"
          />
        </a>
        <nav>
          <a href="/bio.html"><span style="white-space: nowrap">◊ BIO</span></a>
          <a href="/music.html"
            ><span style="white-space: nowrap">◊ MUSIC</span></a
          >
          <a href="https://www.instagram.com/striplacquer" target="_blank" rel="noopener noreferrer">
            <span style="white-space: nowrap">◊ INSTAGRAM</span>
          </a>        
          <a href="/newsletter.html"
            ><span style="white-space: nowrap">◊ NEWSLETTER</span></a
          >
          <a href="/contact.html"
            ><span style="white-space: nowrap">◊ CONTACT</span></a
          >
        </nav>
      </div>

      <div class="banner-content">
        <h1><em>contact@striplacquer.com</em></h1>
      </div>
    </header>
  </body>
</html>
