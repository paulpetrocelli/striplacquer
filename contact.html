<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝑺𝑻𝑹𝑰𝑷 𝑳𝑨𝑪𝑸𝑼𝑬𝑹</title>
  <link rel="icon" type="image/x-icon" href="img/favicon9.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Sidebar -->
  <div class="left-column">
    <a href="/index.html" class="logo-link">
      <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo">
    </a>

    <nav>
      <a href="/bio.html">BIO</a>
      <a href="/music.html">MUSIC</a>
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
      <a href="/newsletter.html">NEWSLETTER</a>
      <a href="/contact.html">CONTACT</a>
    </nav>
  </div>

  <!-- Centered Email -->
  <div class="home-wrapper">
    <p class="contact-email">contact@striplacquer.com</p>
  </div>

  <style>
    /* Keep home-wrapper centering exactly like index page */
    .home-wrapper {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2000;            /* Brought to absolute front layer */
      width: auto;              /* Prevents wide invisible box from blocking layout */
      max-width: 90vw;          /* Keeps container bounded on smaller viewports */
      pointer-events: none;     /* Allows mouse interactions to pass through container */
    }

    /* Email styling: sit visually above page content without blocking sidebar */
    .contact-email {
      font-family: "Edition", serif;
      font-size: 6rem;
      color: #dbdbdb;
      margin: 0;
      line-height: 1.2;
      user-select: text;        /* Standard text selection */
      -webkit-user-select: text;/* Safari support */
      cursor: text;
      pointer-events: auto;     /* Re-enables text highlight inside container */
      display: inline-block;
      padding: 0 1rem;          /* Small buffer to make highlight smoother */
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .contact-email {
        font-size: 3rem;
      }
    }
  </style>

</body>
</html>
