<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝑺𝑻𝑹𝑰𝑷 𝑳𝑨𝑪𝑸𝑼𝑬𝑹</title>
  <link rel="icon" type="image/x-icon" href="img/favicon9.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Sidebar -->
  <div class="left-column">
    <a href="/index.html" class="logo-link">
      <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo">
    </a>

    <nav>
      <a href="/bio.html">BIO</a>
      <a href="/music.html">MUSIC</a>
      <a href="https://www.instagram.com/striplacquer" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
      <a href="/newsletter.html">NEWSLETTER</a>
      <a href="/contact.html">CONTACT</a>
    </nav>
  </div>

  <!-- Full-page overlay for email -->
  <div class="email-overlay">
    <p class="contact-email">contact@striplacquer.com</p>
  </div>

  <style>
    /* Full-page overlay sits on top of everything */
    .email-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;          /* above everything else */
      pointer-events: auto;    /* allow interaction with the email */
      background: transparent; /* no visual obstruction */
      text-align: center;
    }

    /* Email styling */
    .contact-email {
      font-family: "Edition", serif;
      font-size: 6rem;
      color: #dbdbdb;
      user-select: text;       /* fully highlightable */
      cursor: text;
      line-height: 1.2;
      margin: 0;
      display: inline-block;   /* ensures pointer-events behave correctly */
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .contact-email {
        font-size: 3rem;
      }
    }
  </style>

</body>
