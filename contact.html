<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT — Strip Lacquer</title>
  <link rel="icon" type="image/x-icon" href="img/favicon9.png">

  <!-- LINK YOUR STYLESHEET -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Sidebar -->
  <div class="left-column">
    <a href="/index.html" class="logo-link">
      <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo">
    </a>

    <nav>
      <a href="/bio.html">BIO</a>
      <a href="/music.html">MUSIC</a>
      <a href="https://www.instagram.com/striplacquer" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
      <a href="/newsletter.html">NEWSLETTER</a>
      <a href="/contact.html">CONTACT</a>
    </nav>
  </div>

  <!-- Centered Contact Email -->
  <div class="home-wrapper">
    <p class="contact-email">contact@striplacquer.com</p>
  </div>

  <style>
    /* Center wrapper and make email fixed in the middle */
    .home-wrapper {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 100%;
      z-index: 10;
    }

    /* Email styling */
    .contact-email {
      font-family: "Edition", serif;
      font-size: 4rem;
      color: #dbdbdb;
      user-select: text; /* fully highlightable */
      cursor: text;
      line-height: 1.2;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .contact-email {
        font-size: 2.5rem;
      }
    }
  </style>

</body>
</html>
