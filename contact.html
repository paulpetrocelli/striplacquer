<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT — Strip Lacquer</title>
  <link rel="icon" type="image/x-icon" href="img/favicon9.png">

  <!-- LINK YOUR STYLESHEET -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Sidebar -->
  <div class="left-column">
    <a href="/index.html" class="logo-link">
      <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo">
    </a>

    <nav>
      <a href="/bio.html">BIO</a>
      <a href="/music.html">MUSIC</a>
      <a href="https://www.instagram.com/striplacquer" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
      <a href="/newsletter.html">NEWSLETTER</a>
      <a href="/contact.html">CONTACT</a>
    </nav>
  </div>

  <!-- Centered Contact Email -->
  <div class="home-wrapper">
    <p class="contact-email">contact@striplacquer.com</p>
  </div>

  <style>
    /* Ensure sidebar stays on the left without blocking the center content */
    .left-column {
      position: fixed;
      top: 0;
      left: 0;
      width: 200px; /* fixed width for sidebar */
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 25px;
      z-index: 1000; /* sidebar above background but below email */
      pointer-events: auto; /* normal sidebar behavior */
    }

    /* Center wrapper using flex, takes full viewport */
    .home-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      z-index: 2000; /* above sidebar to avoid blocking highlight */
      pointer-events: none; /* container itself does not block */
    }

    /* Make the email fully interactive for highlighting */
    .contact-email {
      pointer-events: auto; /* allow text selection */
      font-family: "Edition", serif;
      font-size: 6rem;
      color: #dbdbdb;
      user-select: text; /* fully highlightable */
      cursor: text;
      text-align: center;
      line-height: 1.2;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .contact-email {
        font-size: 3rem;
      }
    }
  </style>

</body>
</html>
