<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT — Strip Lacquer</title>
  <link rel="icon" type="image/x-icon" href="img/favicon9.png">

  <!-- LINK YOUR STYLESHEET -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Sidebar -->
  <div class="left-column">
    <a href="/index.html" class="logo-link">
      <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo">
    </a>

    <nav>
      <a href="/bio.html">BIO</a>
      <a href="/music.html">MUSIC</a>
      <a href="https://www.instagram.com/striplacquer" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
      <a href="/newsletter.html">NEWSLETTER</a>
      <a href="/contact.html">CONTACT</a>
    </nav>
  </div>

  <!-- Centered Contact Email -->
  <div class="home-wrapper">
    <p class="contact-email">contact@striplacquer.com</p>
  </div>

  <style>
    /* Center the email exactly in the viewport */
    .home-wrapper {
      display: flex;
      align-items: center;       /* vertical center */
      justify-content: center;   /* horizontal center */
      height: 100vh;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 10; /* above background */
    }

    /* Email styling */
    .contact-email {
      font-family: "Edition", serif;
      font-size: 6rem;
      color: #dbdbdb;
      user-select: text;       /* fully highlightable */
      cursor: text;
      margin: 0;               /* remove extra spacing */
      line-height: 1.2;
      z-index: 100;            /* ensure it sits above everything visually */
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .contact-email {
        font-size: 3rem;
      }
    }
  </style>

</body>
</html>
