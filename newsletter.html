<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝑺𝒕𝒓𝒊𝒑 𝑳𝒂𝒄𝒒𝒖𝒆𝒓</title>
  <link rel="icon" type="img/x-icon" href="img/favicon9.png">
  <link rel="stylesheet" href="styles.css"> <!-- Your site CSS -->
  <style>
    /* Newsletter page specific styles */
    .newsletter-container {
      width: 400px;
      max-width: 400px;
      margin: 150px auto 0 auto;
      padding: 30px;
      border: 2px solid #f78f8f;  /* Matches your category/nav pink */
      background: transparent;
      text-align: center;
      font-family: "Traditional Arabic", serif;
      color: #f78f8f;
    }
    .newsletter-title {
      font-size: 28px;
      margin-bottom: 20px;
    }
    .newsletter-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .newsletter-form input[type="email"] {
      padding: 10px;
      font-size: 18px;
      border: 1px solid #f78f8f;
      border-radius: 4px;
      background: transparent;
      color: #f78f8f;
      text-align: center;
      font-family: "Traditional Arabic", serif;
    }
    .newsletter-form input[type="email"]::placeholder {
      color: #f78f8f;
      opacity: 0.8;
    }
    .newsletter-form button {
      padding: 12px;
      font-size: 18px;
      border: 2px solid #f78f8f;
      border-radius: 4px;
      background: transparent;
      color: #f78f8f;
      cursor: pointer;
      font-family: "Traditional Arabic", serif;
      transition: background 0.3s, color 0.3s;
    }
    .newsletter-form button:hover {
      background: #f78f8f;
      color: #000;
    }
  </style>
</head>
<body>

  <header class="banner">
    <div class="top-bar">
      <!-- Clickable logo links to homepage -->
      <a href="/index.html" class="logo-link">
        <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo">
      </a>
      <nav>
        <a href="/bio.html">◊ BIO </a>
        <a href="/music.html">◊ MUSIC </a>
        <a href="/gallery.html">◊ GALLERY </a>
        <a href="newsletter.html" class="active">◊ NEWSLETTER </a>
      </nav>
    </div>
  </header>

  <!-- Centered Newsletter Box -->
  <main>
    <section class="newsletter-container">
      <h1 class="newsletter-title">Sign Up for Our Newsletter</h1>
      
      <!-- MailerLite Form (replace the action URL below with your real one) -->
      <form action="https://assets.mlcdn.com/fonts.css?version=1753253" method="post" class="newsletter-form">
        <input type="email" name="fields[email]" placeholder="Enter your email" required>
        <button type="submit">Subscribe</button>
      </form>
    </section>
  </main>

</body>
</html>
