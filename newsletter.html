<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝑺𝒕𝒓𝒊𝒑 𝑳𝒂𝒄𝒒𝒖𝒆𝒓</title>
  <link rel="icon" type="img/x-icon" href="img/favicon9.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      font-family: "Traditional Arabic", serif;
      color: #f78f8f;
      background-color: #000; /* No fabric background */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top bar matches other pages */
    .top-bar {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0 30px;
      z-index: 1000;
    }

    .logo-link {
      display: inline-block;
      height: 120px;
      margin-right: 50px;
    }

    .site-logo {
      height: 100%;
      display: block;
    }

    nav {
      display: flex;
      gap: 2rem;
      font-size: 1rem;
    }

    nav a {
      text-decoration: none;
      color: #f78f8f;
      font-weight: bold;
      letter-spacing: 1px;
      position: relative;
      font-family: inherit;
    }

    nav a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      left: 0;
      bottom: -4px;
      background-color: #f78f8f;
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* Centered newsletter container */
    .newsletter-container {
      margin: auto;
      margin-top: 220px; /* Matches other pages' spacing under header */
      max-width: 400px;
      width: 90%; /* Scales down for smaller screens */
      padding: 30px;
      border: 2px solid #f78f8f;
      background: transparent;
      text-align: center;
      color: #f78f8f;
      box-sizing: border-box;
    }

    .newsletter-title {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .newsletter-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .newsletter-form input[type="email"] {
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #f78f8f;
      border-radius: 4px;
      background: transparent;
      color: #f78f8f;
      text-align: center;
      font-family: "Traditional Arabic", serif;
      box-sizing: border-box;
    }

    .newsletter-form input[type="email"]::placeholder {
      color: #f78f8f;
      opacity: 0.8;
    }

    .newsletter-form button {
      padding: 12px;
      font-size: 1rem;
      border: 2px solid #f78f8f;
      border-radius: 4px;
      background: transparent;
      color: #f78f8f;
      cursor: pointer;
      font-family: "Traditional Arabic", serif;
      transition: background 0.3s, color 0.3s;
    }

    .newsletter-form button:hover {
      background: #f78f8f;
      color: #000;
    }

    /* Responsive tweaks */
    @media (max-width: 500px) {
      .newsletter-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <a href="/index.html" class="logo-link">
        <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo">
      </a>
      <nav>
        <a href="/bio.html">◊ BIO </a>
        <a href="/music.html">◊ MUSIC </a>
        <a href="/gallery.html">◊ GALLERY </a>
        <a href="newsletter.html" class="active">◊ NEWSLETTER </a>
      </nav>
    </div>
  </header>

  <!-- Newsletter signup -->
  <main>
    <section class="newsletter-container">
      <h1 class="newsletter-title">Sign Up for Our Newsletter</h1>
      <form action="https://assets.mlcdn.com/fonts.css?version=1753253" method="post" class="newsletter-form">
        <input type="email" name="fields[email]" placeholder="Enter your email" required>
        <button type="submit">Subscribe</button>
      </form>
    </section>
  </main>

</body>
</html>
