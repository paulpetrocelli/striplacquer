<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWSLETTER — Strip Lacquer</title>
  <link rel="icon" type="image/x-icon" href="img/favicon9.png">
  <link rel="stylesheet" href="styles.css">

  <style>
    /* ------------------ GLOBAL RESET & SETUP ------------------ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #dbdbdb;
      font-family: "Traditional Arabic", serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ------------------ LEFT COLUMN / NAV (FIXED CLICK LAYER) ------------------ */
    .left-column {
      position: fixed;
      top: 25px;
      left: 2vw;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 2000;
      width: max-content;
      pointer-events: none;
    }

    .logo-link {
      display: inline-block;
      height: 150px;
      pointer-events: auto;
    }

    .site-logo {
      height: 100%;
      display: block;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin-top: 80px;
      width: max-content;
    }

    nav a {
      display: inline-block;
      text-decoration: none;
      color: #dbdbdb;
      font-family: "Edition", serif;
      font-size: 3rem;
      letter-spacing: 1.5px;
      white-space: nowrap;
      line-height: 0.9;
      pointer-events: auto;
    }

    /* ------------------ CENTERED NEWSLETTER LAYOUT ------------------ */
    .main-content {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      pointer-events: auto;
    }

    /* Matches the size constraints of the music section setup */
    .newsletter-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 230px; /* Exact same width as your music page links */
    }

    .newsletter-title {
      font-family: "Edition", serif;
      font-size: 1.2rem;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      text-align: center;
      text-transform: uppercase;
    }

    .newsletter-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    /* Input matches the exact aesthetic footprint of the music buttons */
    .newsletter-form input[type="email"] {
      width: 100%;
      height: 52px;
      background: transparent;
      border: 1px solid #dbdbdb;
      color: #dbdbdb;
      font-family: "Edition", serif;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-align: center;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.3s ease;
    }

    /* Soft border highlight on focus while maintaining block symmetry */
    .newsletter-form input[type="email"]:focus {
      border-color: #fff;
    }

    /* Placeholder text styling matching layout tone */
    .newsletter-form input[type="email"]::placeholder {
      color: rgba(219, 219, 219, 0.5);
      text-transform: uppercase;
    }

    /* Button matches the music link hover animations precisely */
    .newsletter-form button {
      width: 100%;
      height: 52px;
      background: transparent;
      border: 1px solid #dbdbdb;
      color: #dbdbdb;
      font-family: "Edition", serif;
      font-size: 1.2rem;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .newsletter-form button:hover {
      background-color: #dbdbdb;
      color: #000;
    }

    /* Success screen matched to standard form font dimensions */
    .success-message {
      display: none;
      font-family: "Edition", serif;
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: #dbdbdb;
      text-transform: uppercase;
      text-align: center;
      line-height: 52px; /* Centers text vertically in equivalent button space */
      width: 100%;
      height: 52px;
      border: 1px solid transparent;
    }

    #hidden_iframe {
      display: none;
    }

    /* ------------------ MOBILE ------------------ */
    @media (max-width: 768px) {
      nav a {
        font-size: 2rem;
      }
      
      .newsletter-container {
        width: 200px; /* Drops to mobile button width matching music layout */
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar Menu -->
  <div class="left-column">
    <a href="/index.html" class="logo-link">
      <img src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png" class="site-logo" alt="Strip Lacquer Logo">
    </a>
    <nav>
      <a href="/bio.html">BIO</a>
      <a href="/music.html">MUSIC</a>
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
      <a href="/newsletter.html">NEWSLETTER</a>
      <a href="/contact.html">CONTACT</a>
    </nav>
  </div>

  <!-- Centered Block Layer -->
  <div class="main-content">
    <div class="newsletter-container">
      
      <div class="newsletter-title" id="formTitle">
        TRANSMISSIONS ~
      </div>

      <form
        id="newsletterForm"
        action="https://mailerlite.com"
        method="post"
        target="hidden_iframe"
        class="newsletter-form"
      >
        <input
          type="email"
          name="fields[email]"
          placeholder="enter your email"
          required
          autocomplete="email"
        >
        <button type="submit">
          SUBSCRIBE
        </button>
      </form>

      <div id="successMessage" class="success-message">
        SUCCESS.
      </div>

    </div>
  </div>

  <!-- Invisible target frame handles MailerLite endpoint seamlessly -->
  <iframe name="hidden_iframe" id="hidden_iframe"></iframe>

  <script>
    const form = document.getElementById("newsletterForm");
    const title = document.getElementById("formTitle");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function() {
      form.style.display = "none";
      title.style.display = "none";
      successMessage.style.display = "block";
    });
  </script>

</body>
</html>
