<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>𝑺𝒕𝒓𝒊𝒑 𝑳𝒂𝒄𝒒𝒖𝒆𝒓</title>
    <link rel="icon" type="img/x-icon" href="img/favicon9.png" />
    <style>
      @font-face {
        font-family: "Traditional Arabic";
        src: url("fonts/TraditionalArabic.woff2") format("woff2"),
          url("fonts/TraditionalArabic.woff") format("woff"),
          url("fonts/TraditionalArabic.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      body {
        margin: 0;
        font-family: "Traditional Arabic", serif;
        color: #c9c9c9;
        background-color: #000;
      }

      .banner {
        position: relative;
        background: url("fabric-bg.jpg") center/cover no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding-top: 200px;
      }

      /* Sticky top bar */
      .top-bar {
        position: fixed;
        top: 60px;
        left: 0;
        width: 100%;
        display: flex;
        align-items: center;
        padding: 0 2vw; /* Responsive horizontal padding */
        z-index: 1000;
        gap: 2vw; /* Flexible space between logo and nav */
        box-sizing: border-box;
      }

      .logo-link {
        display: inline-block;
        height: 120px;
        flex-shrink: 0;
      }

      .site-logo {
        height: 100%;
        display: block;
      }

      nav {
        display: flex;
        gap: 2vw;
        font-size: 1rem;
        flex-wrap: wrap;
      }

      nav a {
        text-decoration: none;
        color: #c9c9c9;
        font-weight: bold;
        letter-spacing: 1px;
        position: relative;
        font-family: inherit;
      }

      nav a::after {
        content: "";
        position: absolute;
        width: 0;
        height: 2px;
        left: 0;
        bottom: -4px;
        background-color: #c9c9c9;
        transition: width 0.3s ease;
      }

      nav a:hover::after {
        width: 100%;
      }

      * {
        text-transform: none;
      }

      /* Poster Gallery */
      .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
        padding-top: 180px; /* accounts for top bar */
      }

      .gallery img {
        width: 100%;
        height: auto;
        max-height: 500px;
        object-fit: contain;
        box-shadow: 0 0 10px rgba(247, 143, 143, 0.2);
      }

      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          padding: 0 2vw;
          top: 2vh;
        }
        .logo-link {
          width: 100;
        }
        .site-logo {
          width: 100%;
          object-fit: contain;
        }
        nav {
          justify-content: center;
        }
        .banner-offset {
          height: 35vh;
        }
        .gallery {
          grid-template-columns: auto;
          padding-top: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="banner">
      <div class="top-bar">
        <a href="/index.html" class="logo-link">
          <img
            src="img/SL.TextLogo.2.Horizontal.WhiteBorder(Size3).png"
            class="site-logo"
            alt="Strip Lacquer Logo"
          />
        </a>
        <nav>
          <a href="/bio.html"><span style="white-space: nowrap">◊ BIO</span></a>
          <a href="/music.html"
            ><span style="white-space: nowrap">◊ MUSIC</span></a
          >
          <a href="https://www.instagram.com/striplacquer" target="_blank" rel="noopener noreferrer">
            <span style="white-space: nowrap">◊ INSTAGRAM</span>
          </a>        
          <a href="/newsletter.html"
            ><span style="white-space: nowrap">◊ NEWSLETTER</span></a
          >
          <a href="/contact.html"
            ><span style="white-space: nowrap">◊ CONTACT</span></a
          >
        </nav>
      </div>
    </header>

    <div class="gallery">
      <img
        src="img/posters/Monarch.24.09.2025.png"
        alt="Show Poster Sep 2025"
      />
      <img
        src="img/posters/Wolfechella.05.07.2025.png"
        alt="Show Poster July 2025"
      />
      <img
        src="img/posters/Bambi's.29.05.2025.jpg"
        alt="Show Poster May 2025"
      />
      <img
        src="img/posters/Monarch.11.05.2025.jpg"
        alt="Show Poster May 2025"
      />
      <img
        src="img/posters/Kingston 01.03.2025.jpg"
        alt="Show Poster Mar 2025"
      />
      <img
        src="img/posters/Collective Arts 18.01.2025.jpg"
        alt="Show Poster Jan 2025"
      />
      <img
        src="img/posters/Garrison.24.10.2024.jpg"
        alt="Show Poster Oct 2024"
      />
    </div>
  </body>
</html>
